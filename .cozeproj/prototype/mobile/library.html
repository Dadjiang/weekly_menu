  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>

        navReset('generate.html');
      });
      $('#nav-library').on('click', function(e) {
        e.preventDefault();
        navReset('library.html');
      });
      $('#nav-profile').on('click', function(e) {
        e.preventDefault();
        navReset('profile.html');
      });

      // 搜索框交互
      $('#search-input').on('input', function() {
        var val = $(this).val().trim();
        if (val.length > 0) {
          $('#btn-clear-search').removeClass('hidden');
        } else {
          $('#btn-clear-search').addClass('hidden');
        }
        // 过滤菜谱卡片
        filterRecipes();
      });

      // 清除搜索
      $('#btn-clear-search').on('click', function() {
        $('#search-input').val('').focus();
        $(this).addClass('hidden');
        filterRecipes();
      });

      // 分类标签切换
      $('#category-bar').on('click', '.category-tag', function() {
        $('.category-tag').each(function() {
          $(this).removeClass('bg-primary text-on-primary')
                 .addClass('bg-surface-container text-on-surface-variant');
        });
        $(this).removeClass('bg-surface-container text-on-surface-variant')
               .addClass('bg-primary text-on-primary');
        filterRecipes();
      });

      // 菜谱卡片点击 → 跳转详情
      $('#recipe-grid').on('click', '.recipe-card', function() {
        var id = $(this).data('id');
        navPush('recipe-detail.html?id=' + id);
      });

      // FAB 创建自定义菜谱
      $('#fab-create-recipe').on('click', function() {
        // 点击后应实现：
        // 1. 跳转到创建菜谱页面（如 create-recipe.html）
        // 2. 页面包含：菜谱名称输入、食材列表编辑、步骤编辑、图片上传、卡路里设置等表单
        // 3. 提交后将新菜谱添加到菜谱库列表中
        console.log('创建自定义菜谱');
        navPush('generate.html');
      });

      // 排序按钮
      $('#btn-sort').on('click', function() {
        // 点击后应实现：
        // 1. 弹出底部排序选项面板（按热量、按点赞数、按名称）
        // 2. 选择后重新排列菜谱卡片
        // 3. 支持升序/降序切换
        console.log('排序菜谱');
      });

      // 过滤菜谱函数
      function filterRecipes() {
        var keyword = $('#search-input').val().trim().toLowerCase();
        var activeCategory = $('.category-tag.bg-primary').data('category');
        var visibleCount = 0;

        $('.recipe-card').each(function() {
          var cardCategory = $(this).data('category');
          var cardName = $(this).find('h3').text().toLowerCase();
          var showByCategory = (activeCategory === 'all' || cardCategory === activeCategory);
          var showByKeyword = (keyword === '' || cardName.indexOf(keyword) !== -1);

          if (showByCategory && showByKeyword) {
            $(this).show();
            visibleCount++;
          } else {
            $(this).hide();
          }
        });

        $('#recipe-count').text(visibleCount);
      }
    });
  </script>

  <script>lucide.createIcons();</script>
</body>

</html>
