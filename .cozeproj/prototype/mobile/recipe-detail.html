<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- 字体 -->
  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/>

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="tailwindcss">
    @theme {
      /* === 品牌色（焦糖暖调） === */
      --color-primary:              #C87941;
      --color-primary-container:    #F5DFC8;
      --color-on-primary:           #ffffff;
      /* === 强调色 === */
      --color-accent:               #D94B3D;
      --color-accent-container:     #FDDED9;
      /* === 辅助色 === */
      --color-secondary:            #7A8B4B;
      --color-secondary-container:  #E2E8D0;
      /* === 背景 / 表面（温暖中性色调） === */
      --color-background:                 #FFFBF5;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FFF8EE;
      --color-surface-container:          #FFF2D8;
      --color-surface-container-high:     #F5E6D0;
      --color-surface-container-highest:  #EBDAC4;
      /* === 文字 === */
      --color-on-surface:           #2B1D16;
      --color-on-surface-variant:   #8B7355;
      /* === 功能色 === */
      --color-success:  #7A8B4B;
      --color-error:    #D94B3D;
      --color-warning:  #E8A33D;
      /* === 边框 === */
      --color-outline:          rgba(43, 29, 22, 0.15);
      --color-outline-variant:  rgba(43, 29, 22, 0.08);
      /* === 圆角（温暖圆润） === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.25rem;
      --radius-full: 9999px;
      /* === 阴影（温暖柔和） === */
      --shadow-card:   0 4px 12px rgba(43, 29, 22, 0.10);
      --shadow-float:  0 10px 25px rgba(43, 29, 22, 0.10);
      --shadow-dialog: 0 25px 50px rgba(43, 29, 22, 0.18);
      /* === 字体 === */
      --font-serif: "Playfair Display", "Noto Serif SC", serif;
      --font-sans: system-ui, "Noto Sans SC", sans-serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: system-ui, "Noto Sans SC", sans-serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- 顶部 Header（二级页：返回按钮 + 标题 + 更多操作） -->
  <header class="bg-background sticky top-0 z-40 h-14 flex items-center justify-between px-4">
    <button id="btn-back" class="w-10 h-10 flex items-center justify-center text-on-surface-variant rounded-full
                   hover:bg-surface-container active:bg-surface-container-high transition-colors">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>
    <h1 class="text-base font-semibold text-on-surface">菜谱详情</h1>
    <button id="btn-more" class="w-10 h-10 flex items-center justify-center text-on-surface-variant rounded-full
                   hover:bg-surface-container active:bg-surface-container-high transition-colors">
      <i data-lucide="more-horizontal" class="w-5 h-5"></i>
    </button>
  </header>

  <main class="overflow-y-auto pb-[calc(5rem+env(safe-area-inset-bottom))]">
    <!-- @main-content:start -->

    <!-- 菜谱封面图 -->
    <div class="w-full h-64 overflow-hidden">
      <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800&q=80" alt="番茄炒蛋成品菜品特写" data-category="食物"
           class="w-full h-full object-cover"/>
    </div>

    <!-- 菜谱基本信息 -->
    <div class="px-4 pt-4 pb-3">
      <div class="flex items-start justify-between mb-3">
        <h2 id="recipe-name" class="text-xl font-bold text-on-surface">番茄炒蛋</h2>
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-primary/15 text-primary">家常菜</span>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-1.5">
          <i data-lucide="clock" class="w-4 h-4 text-on-surface-variant"></i>
          <span class="text-sm text-on-surface-variant">15分钟</span>
        </div>
        <div class="flex items-center gap-1.5">
          <i data-lucide="flame" class="w-4 h-4 text-on-surface-variant"></i>
          <span class="text-sm text-on-surface-variant">280kcal</span>
        </div>
        <div class="flex items-center gap-1.5">
          <i data-lucide="signal" class="w-4 h-4 text-on-surface-variant"></i>
          <span class="text-sm text-on-surface-variant">简单</span>
        </div>
      </div>
    </div>

    <!-- 互动栏 -->
    <div class="flex items-center gap-6 px-4 py-3 border-t border-outline-variant/10">
      <button id="btn-like" class="flex items-center gap-1.5 min-w-[48px] min-h-[48px] justify-center">
        <i data-lucide="heart" class="w-5 h-5 text-on-surface-variant"></i>
        <span id="like-count" class="text-sm text-on-surface-variant">128</span>
      </button>
      <button id="btn-favorite" class="flex items-center gap-1.5 min-w-[48px] min-h-[48px] justify-center">
        <i data-lucide="bookmark" class="w-5 h-5 text-on-surface-variant"></i>
        <span class="text-sm text-on-surface-variant">收藏</span>
      </button>
      <button id="btn-share" class="flex items-center gap-1.5 min-w-[48px] min-h-[48px] justify-center">
        <i data-lucide="share-2" class="w-5 h-5 text-on-surface-variant"></i>
        <span class="text-sm text-on-surface-variant">分享</span>
      </button>
    </div>

    <!-- 食材清单区域 -->
    <div class="px-4 pt-5 pb-2">
      <h3 class="text-base font-semibold text-on-surface mb-3">食材清单</h3>
      <div class="bg-surface rounded-xl shadow-card overflow-hidden">
        <!-- 列表-食材1：鸡蛋 -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-outline-variant/10">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center">
              <span class="text-xs font-bold text-primary">蛋</span>
            </div>
            <span class="text-sm text-on-surface">鸡蛋</span>
          </div>
          <span class="text-sm text-on-surface-variant">3个</span>
        </div>
        <!-- 列表-食材2：西红柿 -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-outline-variant/10">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-accent/10 rounded-full flex items-center justify-center">
              <span class="text-xs font-bold text-accent">柿</span>
            </div>
            <span class="text-sm text-on-surface">西红柿</span>
          </div>
          <span class="text-sm text-on-surface-variant">2个</span>
        </div>
        <!-- 列表-食材3：葱花 -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-outline-variant/10">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-secondary/10 rounded-full flex items-center justify-center">
              <span class="text-xs font-bold text-secondary">葱</span>
            </div>
            <span class="text-sm text-on-surface">葱花</span>
          </div>
          <span class="text-sm text-on-surface-variant">适量</span>
        </div>
        <!-- 列表-食材4：盐 -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-outline-variant/10">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-surface-container-high rounded-full flex items-center justify-center">
              <span class="text-xs font-bold text-on-surface-variant">盐</span>
            </div>
            <span class="text-sm text-on-surface">盐</span>
          </div>
          <span class="text-sm text-on-surface-variant">适量</span>
        </div>
        <!-- 列表-食材5：糖 -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-outline-variant/10">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-surface-container-high rounded-full flex items-center justify-center">
              <span class="text-xs font-bold text-on-surface-variant">糖</span>
            </div>
            <span class="text-sm text-on-surface">糖</span>
          </div>
          <span class="text-sm text-on-surface-variant">少许</span>
        </div>
        <!-- 列表-食材6：油 -->
        <div class="flex items-center justify-between px-4 py-3">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-warning/10 rounded-full flex items-center justify-center">
              <span class="text-xs font-bold text-warning">油</span>
            </div>
            <span class="text-sm text-on-surface">油</span>
          </div>
          <span class="text-sm text-on-surface-variant">适量</span>
        </div>
      </div>
    </div>

    <!-- 烹饪步骤区域 -->
    <div class="px-4 pt-5 pb-6">
      <h3 class="text-base font-semibold text-on-surface mb-3">烹饪步骤</h3>
      <div class="space-y-4">
        <!-- 步骤1 -->
        <div class="flex gap-3">
          <div class="flex-shrink-0 w-7 h-7 bg-primary text-on-primary rounded-full flex items-center justify-center text-xs font-bold">1</div>
          <div class="flex-1 pt-0.5">
            <p class="text-sm text-on-surface leading-relaxed">鸡蛋打散加少许盐搅匀</p>
          </div>
        </div>
        <!-- 步骤2 -->
        <div class="flex gap-3">
          <div class="flex-shrink-0 w-7 h-7 bg-primary text-on-primary rounded-full flex items-center justify-center text-xs font-bold">2</div>
          <div class="flex-1 pt-0.5">
            <p class="text-sm text-on-surface leading-relaxed">西红柿切块备用</p>
          </div>
        </div>
        <!-- 步骤3 -->
        <div class="flex gap-3">
          <div class="flex-shrink-0 w-7 h-7 bg-primary text-on-primary rounded-full flex items-center justify-center text-xs font-bold">3</div>
          <div class="flex-1 pt-0.5">
            <p class="text-sm text-on-surface leading-relaxed">热锅凉油倒入蛋液炒至凝固盛出</p>
          </div>
        </div>
        <!-- 步骤4 -->
        <div class="flex gap-3">
          <div class="flex-shrink-0 w-7 h-7 bg-primary text-on-primary rounded-full flex items-center justify-center text-xs font-bold">4</div>
          <div class="flex-1 pt-0.5">
            <p class="text-sm text-on-surface leading-relaxed">锅中加油放入西红柿翻炒出汁</p>
          </div>
        </div>
        <!-- 步骤5 -->
        <div class="flex gap-3">
          <div class="flex-shrink-0 w-7 h-7 bg-primary text-on-primary rounded-full flex items-center justify-center text-xs font-bold">5</div>
          <div class="flex-1 pt-0.5">
            <p class="text-sm text-on-surface leading-relaxed">加入炒好的鸡蛋翻炒均匀调味出锅</p>
          </div>
        </div>
      </div>
    </div>

    <!-- @main-content:end -->
  </main>

  <!-- 底部操作栏 -->
  <div class="fixed bottom-0 left-0 right-0 z-40 bg-surface-container-lowest border-t border-outline-variant/10
              flex items-center gap-3 px-4 py-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
    <button id="btn-edit-recipe" class="flex-1 bg-surface-container text-on-surface-variant border-none py-3.5 rounded-xl text-base font-semibold
                   hover:bg-surface-container-high active:scale-[0.98] transition-all inline-flex items-center justify-center gap-2">
      <i data-lucide="pencil" class="w-4.5 h-4.5"></i>修改菜谱
    </button>
    <button id="btn-add-recipe" class="flex-1 bg-primary text-on-primary border-none py-3.5 rounded-xl text-base font-semibold
                   hover:opacity-90 active:scale-[0.98] transition-all inline-flex items-center justify-center gap-2">
      <i data-lucide="plus" class="w-4.5 h-4.5"></i>加入我的菜谱
    </button>
  </div>

  <script>
    function navPush(route) {
      console.log('[原型演示] PUSH 到: ' + route);
      window.location.href = route;
    }
    function navReplace(route) {
      console.log('[原型演示] REPLACE 为: ' + route);
      window.location.replace(route);
    }
    function navReset(route) {
      console.log('[原型演示] RESET 到: ' + route);
      window.location.href = route;
    }
    function navBack() {
      console.log('[原型演示] BACK 返回上一页');
      if (window.history.length > 1) window.history.back();
    }

    $(function() {
      // 返回按钮
      $('#btn-back').on('click', function() {
        navBack();
      });

      // 更多操作按钮 - 点击后应实现：
      // 1. 弹出底部操作菜单（ActionSheet），包含"复制链接"、"举报"、"取消"等选项
      // 2. 点击"复制链接"将当前页面链接复制到剪贴板并提示成功
      // 3. 点击"举报"跳转到举报页面
      // 4. 点击遮罩或"取消"关闭菜单
      $('#btn-more').on('click', function() {
        console.log('需要弹出更多操作菜单：复制链接、举报等');
      });

      // 点赞按钮 - 切换点赞状态
      var liked = false;
      $('#btn-like').on('click', function() {
        liked = !liked;
        var $icon = $(this).find('i');
        var $count = $('#like-count');
        if (liked) {
          $icon.attr('data-lucide', 'heart').removeClass('text-on-surface-variant').addClass('text-accent');
          $icon.attr('fill', 'currentColor');
          $count.text('129').removeClass('text-on-surface-variant').addClass('text-accent');
        } else {
          $icon.attr('data-lucide', 'heart').removeClass('text-accent').addClass('text-on-surface-variant');
          $icon.removeAttr('fill');
          $count.text('128').removeClass('text-accent').addClass('text-on-surface-variant');
        }
        lucide.createIcons();
      });

      // 收藏按钮 - 切换收藏状态
      var favorited = false;
      $('#btn-favorite').on('click', function() {
        favorited = !favorited;
        var $icon = $(this).find('i');
        var $text = $(this).find('span');
        if (favorited) {
          $icon.attr('data-lucide', 'bookmark').removeClass('text-on-surface-variant').addClass('text-primary');
          $icon.attr('fill', 'currentColor');
          $text.text('已收藏').removeClass('text-on-surface-variant').addClass('text-primary');
        } else {
          $icon.attr('data-lucide', 'bookmark').removeClass('text-primary').addClass('text-on-surface-variant');
          $icon.removeAttr('fill');
          $text.text('收藏').removeClass('text-primary').addClass('text-on-surface-variant');
        }
        lucide.createIcons();
      });

      // 分享按钮 - 点击后应实现：
      // 1. 调用系统分享 API（navigator.share）或弹出自定义分享面板
      // 2. 分享面板包含：微信、朋友圈、QQ、复制链接等渠道
      // 3. 选择渠道后执行对应分享逻辑
      $('#btn-share').on('click', function() {
        console.log('需要弹出分享面板：微信、朋友圈、QQ、复制链接等');
      });

      // 修改菜谱按钮
      $('#btn-edit-recipe').on('click', function() {
        navPush('generate.html?mode=edit&id=recipe-001');
      });

      // 加入我的菜谱按钮 - 点击后应实现：
      // 1. 将当前菜谱添加到用户的个人菜谱库
      // 2. 按钮状态切换为"已加入"，图标变为 check
      // 3. 显示 toast 提示"已加入我的菜谱"
      // 4. 若已加入，再次点击则取消加入
      var added = false;
      $('#btn-add-recipe').on('click', function() {
        added = !added;
        if (added) {
          $(this).html('<i data-lucide="check" class="w-4.5 h-4.5"></i>已加入').removeClass('bg-primary').addClass('bg-secondary');
        } else {
          $(this).html('<i data-lucide="plus" class="w-4.5 h-4.5"></i>加入我的菜谱').removeClass('bg-secondary').addClass('bg-primary');
        }
        lucide.createIcons();
      });
    });
  </script>

  <script>lucide.createIcons();</script>
</body>

</html>
